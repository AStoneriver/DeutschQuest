  <div id="app"></div>
  <script>
/* Opetussisältö: pienet, erikseen harjoiteltavat kokonaisuudet. */
const C = (prompt, options, answer, explain='') => ({type:'choice',prompt,options,answer,explain});
const T = (prompt, answer, explain='') => ({type:'type',prompt,answer,explain});
const O = (prompt, answer, explain='') => ({type:'order',prompt,answer,explain});
const H = (spoken, options, answer, explain='') => ({type:'listen',prompt:'Kuuntele sana ja valitse oikea käännös.',spoken,options,answer,explain});
const L = (id,stage,level,title,subtitle,emoji,goal,grammar,words,examples,questions) => ({id,stage,level,title,subtitle,emoji,goal,grammar,words:words.map(([de,fi])=>({de,fi})),examples:examples.map(([de,fi])=>({de,fi})),questions});

const STAGES = [
  {id:0,title:'Ensiaskeleet',subtitle:'Pienistä onnistumisista liikkeelle',level:'A1 · Alkeet',color:'#edeaff'},
  {id:1,title:'Arjen saksa',subtitle:'Rakenna omaa sanavarastoasi',level:'A1–A2',color:'#e5f8ef'},
  {id:2,title:'Kertomaan ja kuvailemaan',subtitle:'Menneisyys, suunnitelmat ja perustelut',level:'A2',color:'#fff3e2'},
  {id:3,title:'Sujuvampaa ilmaisua',subtitle:'Ajatuksia, ehtoja ja mielipiteitä',level:'B1',color:'#eaf4ff'},
  {id:4,title:'Pitkän saksan haasteet',subtitle:'Lukion A-kielen vaativampia rakenteita',level:'B1+ → B2',color:'#fceaf1'}
];

const LESSONS = [
L(1,0,'A1','Hallo!','Tervehditään ja esittäydytään','👋','Osaat tervehtiä ja sanoa, kuka olet.',
  {title:'Ich bin – minä olen',body:'Saksan olla-verbi on sein. Se taipuu persoonan mukaan: ich bin (minä olen), du bist (sinä olet), er/sie ist (hän on). Saksan lauseessa verbi on tavallisesti toisena lauseenjäsenenä.'},
  [['hallo','hei'],['tschüss','hei hei'],['danke','kiitos'],['bitte','ole hyvä'],['ja','kyllä'],['nein','ei'],['Guten Morgen','hyvää huomenta'],['ich','minä']],
  [['Hallo! Ich bin Mia.','Hei! Minä olen Mia.'],['Du bist Leo.','Sinä olet Leo.'],['Guten Morgen!','Hyvää huomenta!']],
  [C('Miten sanot saksaksi ”minä olen”?',['ich bin','du bist','ich bist','du bin'],'ich bin','Ich + bin on oikea yhdistelmä.'),O('Järjestä: Minä olen Mia.','Ich bin Mia.','Verbi bin tulee toiseksi.'),T('Täydennä: Du ___ Leo.','bist','Du bist = sinä olet.'),H('Danke',['kiitos','hei','ei','ole hyvä'],'kiitos')]),
L(2,0,'A1','Wie heißt du?','Nimet ja kotimaa','🪪','Kysyt nimeä ja kerrot mistä tulet.',
  {title:'Kysymykset ja verbin taivutus',body:'Kysymyssanan sisältävä lause alkaa usein kysymyssanalla: Wie heißt du? (Mikä on nimesi?). Tavallisessa kyllä/ei-kysymyksessä verbi tulee alkuun: Kommst du aus Finnland?'},
  [['Wie?','miten?'],['heißen','olla nimeltään'],['kommen','tulla'],['aus','-sta / -stä'],['Finnland','Suomi'],['Deutschland','Saksa'],['der Name','nimi'],['Woher?','mistä?']],
  [['Wie heißt du?','Mikä sinun nimesi on?'],['Ich heiße Emma.','Minun nimeni on Emma.'],['Ich komme aus Finnland.','Tulen Suomesta.']],
  [C('Miten kysyt nimeä?',['Wie heißt du?','Wo wohnst du?','Was kostet das?','Wie alt bist du?'],'Wie heißt du?'),T('Täydennä: Ich ___ aus Finnland.','komme','Ich komme = minä tulen.'),O('Järjestä: Tulen Suomesta.','Ich komme aus Finnland.'),C('Mitä ”Woher?” kysyy?',['mistä?','milloin?','kuinka monta?','minne?'],'mistä?')]),
L(3,0,'A1','Eins, zwei, drei','Numerot ja ikä','🔢','Lasket kahteenkymmeneen ja kerrot ikäsi.',
  {title:'Wie alt bist du?',body:'Ikä ilmaistaan saksaksi olla-verbillä: Ich bin 16 Jahre alt. (Olen 16-vuotias.) Huomaa, että Jahre on monikko. Kysymys: Wie alt bist du?'},
  [['eins','yksi'],['zwei','kaksi'],['drei','kolme'],['vier','neljä'],['fünf','viisi'],['zehn','kymmenen'],['zwanzig','kaksikymmentä'],['das Jahr','vuosi']],
  [['Ich bin 17 Jahre alt.','Olen 17-vuotias.'],['Wie alt bist du?','Kuinka vanha olet?'],['Zehn plus fünf ist fünfzehn.','Kymmenen plus viisi on viisitoista.']],
  [C('Mikä on saksaksi 20?',['zwanzig','zwölf','zwei','zehn'],'zwanzig'),T('Täydennä: Ich ___ 16 Jahre alt.','bin'),O('Järjestä: Olen 17-vuotias.','Ich bin 17 Jahre alt.'),C('Mitä ”Wie alt bist du?” tarkoittaa?',['Kuinka vanha olet?','Mistä tulet?','Mikä nimesi on?','Missä asut?'],'Kuinka vanha olet?')]),
L(4,0,'A1','Meine Familie','Perhe ja omistus','🏠','Osaat esitellä läheisiäsi.',
  {title:'Mein, meine, dein, deine',body:'Omistusmuoto seuraa substantiivin sukua: mein Vater (minun isäni), meine Mutter (minun äitini), mein Kind (minun lapseni). Vastaavasti dein ja deine tarkoittavat sinun.'},
  [['die Mutter','äiti'],['der Vater','isä'],['die Schwester','sisko'],['der Bruder','veli'],['die Familie','perhe'],['die Eltern','vanhemmat'],['mein','minun (mask./neutr.)'],['meine','minun (fem./mon.)']],
  [['Das ist meine Mutter.','Tämä on minun äitini.'],['Mein Bruder heißt Tim.','Veljeni nimi on Tim.'],['Meine Eltern wohnen hier.','Vanhempani asuvat täällä.']],
  [C('Valitse: ___ Mutter.',['meine','mein','meinen','meinem'],'meine','Mutter on feminiini: meine.'),T('Täydennä: ___ Vater heißt Max.','Mein'),O('Järjestä: Tämä on minun siskoni.','Das ist meine Schwester.'),C('Mikä on ”vanhemmat”?',['die Eltern','die Familie','der Bruder','die Mutter'],'die Eltern')]),
L(5,0,'A1','Mein Tag','Päivä ja preesens','☀️','Kerro, mitä teet tavallisena päivänä.',
  {title:'Säännölliset verbit preesensissä',body:'Säännöllinen verbi wohnen taipuu: ich wohne, du wohnst, er/sie wohnt, wir wohnen, ihr wohnt, sie wohnen. Infinitiivin -en korvataan persoonapäätteellä.'},
  [['lernen','opiskella'],['wohnen','asua'],['arbeiten','työskennellä'],['spielen','pelata / leikkiä'],['heute','tänään'],['morgen','huomenna'],['die Schule','koulu'],['jeden Tag','joka päivä']],
  [['Ich lerne Deutsch.','Opiskelen saksaa.'],['Du wohnst in Helsinki.','Sinä asut Helsingissä.'],['Wir spielen heute.','Pelaamme tänään.']],
  [C('Täydennä: Er ___ in Berlin.',['wohnt','wohne','wohnst','wohnen'],'wohnt','Er/sie/es saa päätteen -t.'),T('Täydennä: Ich ___ Deutsch. (lernen)','lerne'),O('Järjestä: Me pelaamme tänään.','Wir spielen heute.'),C('Mikä tarkoittaa ”joka päivä”?',['jeden Tag','heute','morgen','die Schule'],'jeden Tag')]),
L(6,1,'A1','Guten Appetit!','Ruoka ja juoma','🥨','Osaat tilata ja sanoa, mitä haluat.',
  {title:'Akkusatiivi: einen / eine / ein',body:'Kun jokin on tekemisen kohde, saksassa tarvitaan usein akkusatiivi. Maskuliininen ein muuttuu einen: Ich esse einen Apfel. Feminiininen eine ja neutri ein pysyvät tässä ennallaan.'},
  [['das Brot','leipä'],['der Apfel','omena'],['der Kaffee','kahvi'],['das Wasser','vesi'],['die Milch','maito'],['essen','syödä'],['trinken','juoda'],['möchten','haluta (kohteliaasti)']],
  [['Ich möchte einen Kaffee.','Haluaisin kahvin.'],['Ich trinke Wasser.','Juon vettä.'],['Sie isst einen Apfel.','Hän syö omenan.']],
  [C('Valitse: Ich esse ___ Apfel.',['einen','ein','eine','einem'],'einen','Apfel on maskuliini ja akkusatiivi on einen.'),T('Täydennä: Ich ___ Wasser. (trinken)','trinke'),O('Järjestä: Haluaisin kahvin.','Ich möchte einen Kaffee.'),C('Mikä on kohtelias ”haluaisin”?',['ich möchte','ich muss','ich kann','ich bin'],'ich möchte')]),
L(7,1,'A1','Freizeit','Harrastukset ja sanajärjestys','⚽','Osaat kertoa vapaa-ajastasi.',
  {title:'Verbi toisena',body:'Väitelauseessa taipunut verbi on toisena lauseenjäsenenä, vaikka lause alkaisi ajanilmauksella: Heute spiele ich Fußball. (Tänään pelaan jalkapalloa.)'},
  [['lesen','lukea'],['schwimmen','uida'],['tanzen','tanssia'],['laufen','juosta'],['gern','mielellään'],['oft','usein'],['manchmal','joskus'],['das Wochenende','viikonloppu']],
  [['Ich schwimme gern.','Uin mielelläni.'],['Am Wochenende lese ich.','Viikonloppuna luen.'],['Heute laufe ich.','Tänään juoksen.']],
  [C('Valitse oikea sanajärjestys.',['Heute lese ich.','Heute ich lese.','Lese heute ich.','Ich heute lese.'],'Heute lese ich.','Heute on ensimmäinen, lese toinen lauseenjäsen.'),T('Täydennä: Ich schwimme ___.','gern'),O('Järjestä: Tänään minä juoksen.','Heute laufe ich.'),C('Mikä tarkoittaa ”joskus”?',['manchmal','oft','gern','immer'],'manchmal')]),
L(8,1,'A1+','In der Stadt','Kaupunki ja suunnat','🏙️','Pyydät neuvoja ja löydät perille.',
  {title:'Wo? – datiivi paikanilmauksissa',body:'Kun kerrotaan missä joku on, käytetään usein datiivia. Esim. in dem Park → im Park, in der Schule. Kysymyssana on Wo? (Missä?).'},
  [['die Straße','katu'],['der Bahnhof','rautatieasema'],['die Apotheke','apteekki'],['links','vasemmalle'],['rechts','oikealle'],['geradeaus','suoraan'],['die Stadt','kaupunki'],['der Park','puisto']],
  [['Wo ist der Bahnhof?','Missä rautatieasema on?'],['Gehen Sie geradeaus.','Menkää suoraan.'],['Ich bin im Park.','Olen puistossa.']],
  [C('Mikä tarkoittaa ”suoraan”?',['geradeaus','links','rechts','zurück'],'geradeaus'),T('Täydennä: Ich bin ___ Park.','im','in dem lyhenee muotoon im.'),O('Järjestä: Missä rautatieasema on?','Wo ist der Bahnhof?'),C('Millä kysymyssanalla kysytään ”missä”?',['Wo?','Wohin?','Woher?','Wann?'],'Wo?')]),
L(9,1,'A1+','Ich kann das!','Modaaliverbit','💪','Kerrot, mitä voit ja mitä sinun pitää tehdä.',
  {title:'Können, müssen, wollen',body:'Modaaliverbi taipuu ja menee lauseessa toiseksi. Pääverbi jää perusmuotoon lauseen loppuun: Ich kann Deutsch sprechen. / Ich muss heute lernen.'},
  [['können','voida / osata'],['müssen','täytyä'],['wollen','haluta'],['dürfen','saada lupa'],['sprechen','puhua'],['helfen','auttaa'],['jetzt','nyt'],['später','myöhemmin']],
  [['Ich kann Deutsch sprechen.','Osaan puhua saksaa.'],['Du musst lernen.','Sinun täytyy opiskella.'],['Wir wollen gehen.','Haluamme mennä.']],
  [C('Valitse: Ich ___ Deutsch sprechen.',['kann','können','kannst','könnt'],'kann'),T('Täydennä: Du ___ heute lernen. (müssen)','musst'),O('Järjestä: Haluamme mennä.','Wir wollen gehen.'),C('Mihin pääverbi tavallisesti tulee modaaliverbin kanssa?',['lauseen loppuun','aina alkuun','modaaliverbin eteen','ennen subjektia'],'lauseen loppuun')]),
L(10,1,'A2','Einkaufen','Ostokset ja hinnat','🛍️','Asioit kaupassa saksaksi.',
  {title:'Akkusatiivi ja kein',body:'Kieltosana kein taipuu kuten ein. Ich habe keinen Euro (maskuliinin akkusatiivi), keine Zeit (feminiini), kein Geld (neutri). Kein kieltää substantiivia; nicht kieltää muita ilmauksia.'},
  [['kaufen','ostaa'],['bezahlen','maksaa'],['teuer','kallis'],['billig','halpa'],['das Geld','raha'],['der Preis','hinta'],['die Größe','koko'],['die Rechnung','lasku']],
  [['Wie viel kostet das?','Kuinka paljon tämä maksaa?'],['Ich habe kein Geld.','Minulla ei ole rahaa.'],['Die Jacke ist zu teuer.','Takki on liian kallis.']],
  [C('Valitse: Ich habe ___ Geld.',['kein','keine','keinen','nicht'],'kein','Geld on neutri: kein Geld.'),T('Täydennä: Wie viel ___ das? (kosten)','kostet'),O('Järjestä: Minulla ei ole rahaa.','Ich habe kein Geld.'),C('Mikä on ”kallis”?',['teuer','billig','groß','klein'],'teuer')]),
L(11,2,'A2','Gestern war...','Menneisyys: Perfekt + haben','🕰️','Kerrot, mitä teit eilen.',
  {title:'Perfekt: haben + partisiippi',body:'Puhekielen tavallinen mennyt aika muodostuu apuverbillä haben ja partisiipilla. Ich habe gelernt. Säännöllinen partisiippi on usein ge- + vartalo + -t: machen → gemacht.'},
  [['gestern','eilen'],['früher','aikaisemmin'],['gemacht','tehnyt'],['gelernt','opiskellut'],['gespielt','pelannut'],['gekauft','ostanut'],['besucht','vieraillut'],['das Erlebnis','kokemus']],
  [['Ich habe gestern gelernt.','Opiskelin eilen.'],['Wir haben Fußball gespielt.','Pelasimme jalkapalloa.'],['Sie hat Brot gekauft.','Hän osti leipää.']],

  {title:'Perfekt: sein liikkeen kanssa',body:'Monet paikasta toiseen siirtymistä tai tilanmuutosta kuvaavat verbit käyttävät apuverbiä sein: Ich bin gefahren, wir sind angekommen. Apuverbi taipuu tekijän mukaan.'},

  function makeQuickQuestions(pool,mode,retry=false){

  function generateVocabQuestion(l,i,direction){
    const w=l.words[i],wordId=`${l.id}:${i}`,reverse=direction==='reverse';
    const answer=reverse?w.de:w.fi;
    const distractors=shuffle(l.words.filter((_,j)=>j!==i).map(x=>reverse?x.de:x.fi)).slice(0,3);
    const q={type:'choice',prompt:reverse?`Miten sanotaan saksaksi ”${w.fi}”?`:`Mitä tarkoittaa ”${w.de}”?`,options:shuffle([answer,...distractors]),answer,explain:`${w.de} = ${w.fi}`,wordId,lessonId:l.id};
    if(!reverse && i%5===4){q.type='listen';q.prompt='Kuuntele ja valitse, mitä kuulet.';q.spoken=w.de;}
    return q;
  }
  function generateLessonQuestions(l){
    const wordIndices=shuffle(l.words.map((_,i)=>i)).slice(0,5);
    const vocab=wordIndices.map((idx,n)=>generateVocabQuestion(l,idx,n%2?'reverse':'forward'));
    vocab[4]=generateVocabQuestion(l,wordIndices[4],'forward');
    vocab[4].type='listen';
    vocab[4].prompt='Kuuntele ja valitse, mitä kuulet.';
    vocab[4].spoken=l.words[wordIndices[4]].de;
    const grammar=l.questions.map((q,i)=>({...q,lessonId:l.id,grammarId:`${l.id}:${i}`}));
    return [vocab[0],vocab[1],grammar[0],vocab[2],grammar[1],vocab[3],grammar[2],vocab[4],grammar[3]];
  }
  function reviewQuestions(onlyDue){
    const wordCards=knownWords().filter(w=>state.cards[w.key]);
    const selected=onlyDue?wordCards.filter(w=>(state.cards[w.key].dueAt||0)<=Date.now()):shuffle(wordCards);
    const qs=shuffle(selected).slice(0,10).map((w,i)=>generateVocabQuestion(lessonById(w.lessonId),Number(w.key.split(':')[1]),i%2?'reverse':'forward'));
    const entries=Object.keys(state.mistakes);
    for(const key of shuffle(entries)){
      const [lid,qi]=key.split(':').map(Number),l=lessonById(lid);
      if(l?.questions[qi])qs.push({...l.questions[qi],lessonId:lid,grammarId:key});
    }
    return shuffle(qs).slice(0,10);
  }
  function startLesson(id){
    const l=lessonById(id);if(!l||!isUnlocked(l.id))return;
    current.lessonId=l.id;current.view='practice';current.session={mode:'lesson',lessonId:l.id,questions:generateLessonQuestions(l),index:0,correct:0,hearts:5,selected:'',typed:'',tokens:[],feedback:null,wrong:[],earned:0};render();window.scrollTo(0,0);
  }
  function startReview(due){
    const qs=reviewQuestions(due);if(!qs.length){toast('Suorita ensin oppitunti, niin saat kerrattavaa.');return;}
    current.view='practice';current.session={mode:'review',questions:qs,index:0,correct:0,hearts:5,selected:'',typed:'',tokens:[],feedback:null,wrong:[],earned:0};render();window.scrollTo(0,0);
  }
  const normal=s=>String(s??'').toLocaleLowerCase('de-DE').trim().replace(/[.!?,:;„“"']/g,'').replace(/\s+/g,' ').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  function isCorrect(q,answer){const accepted=Array.isArray(q.answer)?q.answer:[q.answer];return accepted.some(a=>normal(a)===normal(answer));}
  function currentQuestion(){const s=current.session;return s?.questions[s.index];}
  function orderTokens(q){return shuffle(q.answer.trim().split(/\s+/).map((word,i)=>({word,id:i})));}
  let displayedTokens=[];
  function renderPractice(){
    const s=current.session;if(!s)return nav('home');const q=currentQuestion();if(!q)return finish();
    const done=Boolean(s.feedback),pct=100*s.index/s.questions.length;
    const isOrder=q.type==='order',isType=q.type==='type',isListen=q.type==='listen';
    if(isOrder && !displayedTokens.length){displayedTokens=orderTokens(q);}
    let controls='';
    if(q.type==='choice'||isListen){controls=`<div class="options">${q.options.map((opt,i)=>{
      const selected=s.selected===opt,cls=done?(opt===q.answer?'correct':selected?'wrong':''):selected?'selected':'';
      return `<button data-action="choose" data-index="${i}" class="option ${cls}" ${done?'disabled':''}>${escape(opt)}</button>`;
    }).join('')}</div>`;}
    if(isType){controls=`<div style="margin-top:25px"><label class="micro" for="answer-input">Kirjoita vastauksesi tähän</label><input id="answer-input" class="answer-field" type="text" placeholder="Kirjoita vastauksesi…" autocomplete="off" autocapitalize="none" spellcheck="false" value="${escape(s.typed)}" ${done?'disabled':''} /></div>`;}
    if(isOrder){controls=`<div class="micro">Napauta sanoja oikeassa järjestyksessä.</div><div class="order-answer">${s.tokens.length?s.tokens.map(idx=>`<button class="token placed" data-action="remove-token" data-index="${idx}" ${done?'disabled':''}>${escape(displayedTokens[idx].word)}</button>`).join(''):'<span class="hint">Lause muodostuu tähän…</span>'}</div><div class="tokens">${displayedTokens.map((t,i)=>`<button class="token" data-action="add-token" data-index="${i}" ${s.tokens.includes(i)||done?'disabled':''}>${escape(t.word)}</button>`).join('')}</div>`;}
    let feedback='';if(done){feedback=`<div class="feedback ${s.feedback.correct?'good':'bad'}" role="status"><span class="feedback-icon">${s.feedback.correct?'✨':'💡'}</span><div><strong>${s.feedback.correct?'Richtig! Hienosti tehty!':'Ei haittaa – tästä opitaan!'}</strong><p>${s.feedback.correct?'+10 XP · ':`Oikea vastaus: ${escape(Array.isArray(q.answer)?q.answer[0]:q.answer)}. `}${escape(q.explain||'Jatketaan yhdessä eteenpäin.')}</p></div></div>`;}
    const answer=s.typed||s.selected||s.tokens.map(i=>displayedTokens[i]?.word).join(' ');
    const canCheck=Boolean(String(answer||'').trim());
    shell(`<div class="practice-wrap"><div class="practice-top"><button class="exit" data-action="quit" aria-label="Poistu harjoituksesta" title="Poistu">×</button><div class="practice-progress"><small>${s.mode==='review'?'KERTAUS':'OPPITUNTI '+s.lessonId} · TEHTÄVÄ ${s.index+1}/${s.questions.length}</small><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="heart-list" title="Yrityksiä jäljellä">${'♥'.repeat(s.hearts)}${'♡'.repeat(5-s.hearts)}</div></div>
    <section class="question-card"><div class="question-type">${q.type==='listen'?'🔊 KUUNTELU':isOrder?'🧩 JÄRJESTÄ SANAT':isType?'✍️ KIRJOITA':'🎯 VALITSE OIKEA'} </div><h1>${escape(q.prompt)}</h1><p class="question-context">${isListen?'Paina kaiutinta ja kuuntele niin monta kertaa kuin haluat.':isOrder?'Rakenna lause annetuista sanoista.':isType?'Isot ja pienet kirjaimet eivät vaikuta tarkistukseen.':'Valitse mielestäsi paras vaihtoehto.'}</p>${isListen?`<button class="btn btn-soft" data-action="speak" data-text="${escape(q.spoken)}" style="font-size:17px">🔊 Kuuntele uudelleen</button>`:''}${controls}${feedback}</section>
    <div class="practice-footer"><span class="hint">${done?'Jokainen yritys auttaa muistamaan.':s.mode==='review'?'Kertaus vahvistaa muistijälkeä.':'Saat palautteen heti vastauksen jälkeen.'}</span><button class="btn ${done?'btn-green':'btn-primary'}" data-action="${done?'next':'check'}" ${!done&&!canCheck?'disabled':''}>${done?(s.index===s.questions.length-1?'Näytä tulos →':'Jatka →'):'Tarkista vastaus →'}</button></div></div>`);
    if(isType&&!done){const inp=document.getElementById('answer-input');inp?.focus();inp?.setSelectionRange(inp.value.length,inp.value.length);}
  }

  function updateCard(wordId,correct,review){
    let card=state.cards[wordId]||{strength:0,dueAt:0,seen:0};
    card.seen++;
    if(correct){card.strength=Math.min(5,card.strength+1);const intervals=[0,1,3,7,21,60];card.dueAt=Date.now()+intervals[card.strength]*DAY;}
    else{card.strength=0;card.dueAt=Date.now();}
    state.cards[wordId]=card;
  }
  function checkAnswer(){
    const s=current.session,q=currentQuestion();if(!s||!q||s.feedback)return;
    const answer=q.type==='type'?s.typed:q.type==='order'?s.tokens.map(i=>displayedTokens[i].word).join(' '):s.selected;
    if(!String(answer||'').trim())return;
    const correct=isCorrect(q,answer);s.feedback={correct,answer};s.correct+=Number(correct);s.hearts=Math.max(0,s.hearts-(correct?0:1));
    s.earned+=correct?10:2;trackActivity(correct?10:2);
    state.totalAnswered++;if(correct)state.totalCorrect++;
    if(q.wordId)updateCard(q.wordId,correct,s.mode==='review');
    if(q.grammarId){if(correct)delete state.mistakes[q.grammarId];else state.mistakes[q.grammarId]={seenAt:Date.now()};}
    if(!correct)s.wrong.push({prompt:q.prompt,answer:Array.isArray(q.answer)?q.answer[0]:q.answer});
    save();renderPractice();
  }
  function nextQuestion(){const s=current.session;if(!s?.feedback)return;s.index++;s.selected='';s.typed='';s.tokens=[];s.feedback=null;displayedTokens=[];if(s.index>=s.questions.length){finish();return;}renderPractice();}
  function finish(){
    const s=current.session;if(!s)return;const score=Math.round(100*s.correct/s.questions.length);
    if(s.mode==='lesson'){
      const l=lessonById(s.lessonId);const prev=state.completed[l.id];
      // Lempeä etenemiskynnys: 60 %. Uusintakierros on aina mahdollinen.
      if(score>=60){state.completed[l.id]={best:Math.max(prev?.best||0,score),finishedAt:Date.now()};
        for(let i=0;i<l.words.length;i++){const key=`${l.id}:${i}`;if(!state.cards[key])state.cards[key]={strength:0,dueAt:Date.now()+DAY,seen:0};}
        if(!prev){state.xp+=25;state.history[today()]=(state.history[today()]||0)+25;s.earned+=25;}
      }
    }
    s.finalScore=score;current.view='result';save();render();window.scrollTo(0,0);
  }
  function renderResult(){
    const s=current.session,passed=s.mode==='review'||s.finalScore>=60;
    const icon=s.finalScore===100?'🏆':passed?'🎉':'💛';
    const title=s.finalScore===100?'Perfekt!':passed?'Sehr gut! Hienoa työtä!':'Hyvä yritys – kokeillaan uudestaan!';
    shell(`<section class="result"><div class="result-icon">${icon}</div><span class="eyebrow">${s.mode==='review'?'KERTAUS VALMIS':'OPPITUNTI '+s.lessonId+' VALMIS'}</span><h1>${title}</h1><p>${s.mode==='review'?'Muistijäljet vahvistuivat taas. Tule takaisin huomenna!':passed?'Sait oppitunnin valmiiksi ja avasit seuraavan askeleen.':'Harjoittele vielä kerran. Jo muutama lisäoivallus riittää seuraavaan tasoon.'}</p><div class="result-score"><div><strong>${s.finalScore}%</strong><span>OIKEIN</span></div><div><strong>+${s.earned}</strong><span>XP-PISTEITÄ</span></div><div><strong>${s.correct}/${s.questions.length}</strong><span>TEHTÄVÄÄ</span></div></div>${s.wrong.length?`<div style="background:#fff8ec;border-radius:15px;padding:15px;text-align:left;margin-bottom:22px"><strong style="font-size:13px">🧠 Näihin palataan kertauksessa</strong><ul style="font-size:12px;color:#6d7181;line-height:1.8;margin-bottom:0">${s.wrong.slice(0,4).map(w=>`<li>${escape(w.prompt)} → <strong>${escape(w.answer)}</strong></li>`).join('')}</ul></div>`:''}<div class="result-buttons"><button class="btn btn-outline" data-action="nav" data-view="home">Oppimispolku</button>${s.mode==='lesson'?`<button class="btn btn-soft" data-action="start" data-id="${s.lessonId}">Harjoittele uudelleen</button>${passed&&s.lessonId<LESSONS.length?`<button class="btn btn-primary" data-action="lesson" data-id="${s.lessonId+1}">Seuraava oppitunti →</button>`:''}`:`<button class="btn btn-primary" data-action="nav" data-view="review">Kertaukseen →</button>`}</div></section>`);
  }

  function renderReview(){
    const due=reviewDueCount(),known=knownWords().length;
    shell(`<div class="eyebrow">PIDÄ TAIDOT TUOREINA</div><h1 class="page-title">Kertauspaja 🧠</h1><p class="page-subtitle">Kertausväli kasvaa, kun osaat sanan hyvin. Virheet palaavat harjoituksiin, mutta täällä ei tarvitse pelätä epäonnistumista.</p><div class="stat-grid"><div class="stat-card"><span class="stat-icon">⏰</span><div><strong>${due}</strong><small>kerrattavaa nyt</small></div></div><div class="stat-card"><span class="stat-icon">📗</span><div><strong>${known}</strong><small>tuttua sanaa</small></div></div><div class="stat-card"><span class="stat-icon">⭐</span><div><strong>${masteredCount()}</strong><small>vahvasti hallussa</small></div></div></div><div class="review-banner"><div style="display:flex;align-items:center;gap:14px"><span class="review-emoji">${due?'🔥':'🌿'}</span><div><strong>${due?'Kertaus odottaa sinua!':'Kaikki ajantasaiset kertaukset tehty!'}</strong><p>${due?'Saat enintään 10 kysymystä kerrallaan.':'Voit silti harjoitella tuttuja sanoja vapaasti.'}</p></div></div><button class="btn btn-primary" data-action="review" data-due="1" ${due?'':'disabled'}>Kertaa nyt →</button></div><div class="section-header"><h2>Lisää harjoittelua</h2></div><div class="side-card" style="max-width:680px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap"><div><h3>🎲 Sanastotreeni</h3><p style="margin:0">Satunnaisia kysymyksiä jo opituista sanoista. Hyvä tapa kerätä XP:tä.</p></div><button class="btn btn-soft" data-action="review" data-due="0" ${known?'':'disabled'}>Aloita treeni</button></div>${!known?'<div class="empty" style="margin-top:18px"><span class="emoji">🌱</span><strong>Ensin yksi oppitunti</strong>Sanat ja kieliopin kertaukset ilmestyvät tänne harjoittelun myötä.</div>':''}`);
  }
  function renderWords(){
    const known=knownWords();
    const filterWord=w=>{const q=current.search.toLocaleLowerCase();const matched=(w.de+' '+w.fi).toLocaleLowerCase().includes(q);const card=state.cards[w.key];return matched&&(current.wordFilter==='all'||(current.wordFilter==='mastered'?card?.strength>=3:!(card?.strength>=3)));};
    const items=known.filter(filterWord);
    shell(`<div class="eyebrow">OMA SANAPANKKI</div><h1 class="page-title">Sanat haltuun 📚</h1><p class="page-subtitle">Sanastosi kasvaa oppituntien mukana. Kuuntele ääntäminen kaiutinpainikkeesta ja seuraa, mitkä sanat ovat jo vahvasti muistissa.</p><div class="review-controls"><input class="wordbook-search" id="word-search" type="search" value="${escape(current.search)}" placeholder="Hae saksaksi tai suomeksi…" aria-label="Hae sanoista" /><div style="display:flex;gap:6px">${[['all','Kaikki'],['practice','Harjoittele'],['mastered','Hallussa']].map(([v,label])=>`<button class="btn ${current.wordFilter===v?'btn-soft':'btn-outline'}" data-action="wordfilter" data-filter="${v}" style="padding:9px 11px;font-size:12px">${label}</button>`).join('')}</div></div>${items.length?`<div class="word-table"><div class="word-row" style="background:#fafaff;color:#8e96a5;font-size:11px;font-weight:900"><span>SAKSA</span><span>SUOMI</span><span>TILA</span><span></span></div>${items.map(w=>{const card=state.cards[w.key];return `<div class="word-row"><strong>${escape(w.de)}</strong><span>${escape(w.fi)}</span><span class="word-status ${card?.strength>=3?'mastered':''}">${card?.strength>=3?'✓ Hallussa':card?.strength>0?'Oppimassa':'Uusi'}</span><button class="sound" data-action="speak" data-text="${escape(w.de)}" aria-label="Kuuntele ${escape(w.de)}">🔊</button></div>`;}).join('')}</div>`:`<div class="empty"><span class="emoji">📖</span><strong>${known.length?'Näillä ehdoilla ei löytynyt sanoja':'Sanapankki on vielä tyhjä'}</strong>${known.length?'Kokeile toista hakusanaa tai suodatinta.':'Aloita ensimmäinen oppitunti, niin sanat ilmestyvät tänne.'}</div>`}`);
  }
  function renderStats(){
    const days=Array.from({length:7},(_,i)=>dateBefore(6-i)),values=days.map(d=>state.history[d]||0),max=Math.max(30,...values);
    const badges=[{emoji:'🌱',name:'Ensimmäinen askel',sub:'Suorita ensimmäinen oppitunti',ok:completedCount()>=1},{emoji:'🔥',name:'Kolmen päivän putki',sub:'Harjoittele kolme päivää peräkkäin',ok:state.streak>=3},{emoji:'⚡',name:'500 XP',sub:'Kerää 500 kokemuspistettä',ok:state.xp>=500},{emoji:'📚',name:'Sanaseppä',sub:'Tutustu vähintään 50 sanaan',ok:knownWords().length>=50},{emoji:'🎓',name:'A1-valloittaja',sub:'Läpäise 10 oppituntia',ok:completedCount()>=10},{emoji:'🏆',name:'Kielimestari',sub:'Suorita kaikki 24 oppituntia',ok:completedCount()===24}];
    shell(`<div class="eyebrow">OMA MATKASI</div><h1 class="page-title">Edistyminen 🏆</h1><p class="page-subtitle">Näe, miten pienistä harjoituksista kasvaa vahva kielitaito. Jokainen päivä on uusi mahdollisuus.</p><div class="stat-grid"><div class="stat-card"><span class="stat-icon">⚡</span><div><strong>${state.xp}</strong><small>kaikki XP:t</small></div></div><div class="stat-card"><span class="stat-icon">🔥</span><div><strong>${state.streak}</strong><small>päivän putki</small></div></div><div class="stat-card"><span class="stat-icon">🎯</span><div><strong>${state.totalAnswered?Math.round(state.totalCorrect/state.totalAnswered*100):0}%</strong><small>vastaustarkkuus</small></div></div></div><section class="learning-card" style="max-width:950px"><h2>Viimeiset 7 päivää</h2><p>Kokemuspisteitä päivittäin</p><div class="chart-bars">${days.map((d,i)=>`<div class="chart-col" title="${d}: ${values[i]} XP"><div class="micro">${values[i]||''}</div><div class="chart-bar" style="height:${Math.max(4,Math.round(values[i]/max*115))}px"></div><span>${['su','ma','ti','ke','to','pe','la'][new Date(d+'T12:00:00').getDay()]}</span></div>`).join('')}</div></section><div class="section-header"><h2>Saavutukset</h2><span class="small">${badges.filter(b=>b.ok).length}/${badges.length} ansaittu</span></div><div class="milestone-grid">${badges.map(b=>`<div class="milestone ${b.ok?'earned':''}"><span class="emoji">${b.emoji}</span><strong>${b.name}</strong><p>${b.sub}</p></div>`).join('')}</div><p class="micro" style="margin-top:27px">🔒 Edistyminen tallentuu tähän selaimeen. Toisella laitteella tai selaintietoja poistettaessa tiedot eivät siirry automaattisesti.</p>`);
  }
  function render(){if(current.view!=='practice')displayedTokens=[];switch(current.view){case 'home':renderHome();break;case 'quick':renderQuick();break;case 'lesson':renderLesson();break;case 'practice':renderPractice();break;case 'result':renderResult();break;case 'review':renderReview();break;case 'words':renderWords();break;case 'stats':renderStats();break;default:renderHome();}}
  function speak(text){if(!('speechSynthesis' in window)){toast('Tällä selaimella ei ole puhetoimintoa.');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.85;u.pitch=1.05;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='de-de')||voices.find(v=>v.lang.toLowerCase().startsWith('de'))||null;speechSynthesis.speak(u);}catch(e){toast('Puheen toistaminen ei onnistunut.');}}
  document.addEventListener('click',event=>{
    const target=event.target.closest('[data-action]');if(!target)return;
    const action=target.dataset.action;
    if(action==='nav')return nav(target.dataset.view);
    if(action==='quick-theme'){current.quick.themeId=target.dataset.theme;renderQuickSelect();return;}
    if(action==='quick-mode'){current.quick.mode=target.dataset.mode;renderQuickSelect();return;}
    if(action==='quick-start')return startQuick(false);
    if(action==='quick-retry')return startQuick(true);
    if(action==='quick-answer')return answerQuick(Number(target.dataset.index));
    if(action==='quick-next')return nextQuick();
    if(action==='quick-exit'){clearInterval(quickTimer);current.quick.stage='select';renderQuickSelect();window.scrollTo(0,0);return;}
    if(action==='lesson'){const id=Number(target.dataset.id);if(!isUnlocked(id))return;current.view='lesson';current.lessonId=id;render();window.scrollTo(0,0);return;}
    if(action==='start')return startLesson(target.dataset.id);
    if(action==='review')return startReview(target.dataset.due==='1');
    if(action==='speak')return speak(target.dataset.text);
    if(action==='quit'){if(current.session?.mode==='lesson'){current.view='lesson';}else{current.view='review';}current.session=null;render();return;}
    if(action==='check')return checkAnswer();
    if(action==='next')return nextQuestion();
    if(action==='choose'){const q=currentQuestion();if(!current.session?.feedback){current.session.selected=q.options[Number(target.dataset.index)];renderPractice();}return;}
    if(action==='add-token'){const s=current.session,i=Number(target.dataset.index);if(!s.feedback&&!s.tokens.includes(i)){s.tokens.push(i);renderPractice();}return;}
    if(action==='remove-token'){const s=current.session,i=Number(target.dataset.index);if(!s.feedback){s.tokens=s.tokens.filter(n=>n!==i);renderPractice();}return;}
    if(action==='wordfilter'){current.wordFilter=target.dataset.filter;renderWords();return;}
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='answer-input'){if(current.session)current.session.typed=event.target.value;const btn=document.querySelector('[data-action="check"]');if(btn)btn.disabled=!event.target.value.trim();}
    if(event.target.id==='word-search'){current.search=event.target.value;const pos=event.target.selectionStart;renderWords();const inp=document.getElementById('word-search');inp?.focus();inp?.setSelectionRange(pos,pos);}
  });
  document.addEventListener('keydown',event=>{
    if(current.view==='quick'&&current.quick?.stage==='play'){
      const q=current.quick.questions[current.quick.index];
      if(event.key==='Enter'&&q?.chosen!==null){event.preventDefault();nextQuick();return;}
      if(['1','2','3','4'].includes(event.key)&&q?.chosen===null){event.preventDefault();answerQuick(Number(event.key)-1);return;}
    }
    if(event.key==='Enter'&&current.view==='practice'){
      if(current.session?.feedback){event.preventDefault();nextQuestion();}
      else if(currentQuestion()?.type==='type'||currentQuestion()?.type==='order'){event.preventDefault();checkAnswer();}
    }
  });
  render();
})();

</script>
